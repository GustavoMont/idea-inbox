[project]
name = "idea-inbox"
version = "0.1.0"
description = "Project to organize and centralize notes and ideas recorded in another devices"
authors = [
    {name = "GustavoMont",email = "lgmluisgm@gmail.com"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poe.tasks]
start = "python3 src/main.py"
dev = "watchmedo auto-restart --directory=. --pattern=\"*.py\" --recursive --no-restart-on-command-exit poe start"


[dependency-groups]
dev = [
    "poethepoet (>=0.49.0,<0.50.0)",
    "watchdog (==6.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
]
